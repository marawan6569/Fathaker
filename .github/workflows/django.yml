name: Django CI

on:
  push:
  pull_request:

env:
  SECRETKEY: ci-only-not-for-production-secret-key-with-at-least-fifty-characters
  DEBUG: "0"
  ALLOWEDHOSTS: localhost;127.0.0.1;testserver
  DEBLOYED: "0"
  SQLITE_PATH: /tmp/fathaker-ci.sqlite3

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: fathaker_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:disposable-test-only@127.0.0.1:5432/fathaker_rehearsal' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip check
      - name: Check settings, migration state, and static collection
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
      - name: Rehearse SQLite to PostgreSQL fixtures
        if: matrix.database == 'postgres'
        env:
          REHEARSAL_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: python deployment/rehearse_migration.py
      - name: Run all tests
        run: python manage.py test --noinput
      - name: Build container without credentials
        if: matrix.database == 'sqlite'
        run: docker build -t fathaker:ci .
